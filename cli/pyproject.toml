[project]
name = "provelog"
version = "1.2.6"
description = "A verifiable, complete trajectory record for AI agents. Stores model and tool inputs/outputs locally as an Ed25519-signed, hash-chained record with RFC 3161 anchoring that anyone can verify offline. Records only: it never blocks or intercepts."
readme = "README.md"
license = "MIT AND AGPL-3.0-or-later"
license-files = ["LICENSE", "LICENSE-AGPL", "NOTICE.md"]
authors = [{ name = "ProveLog", email = "contact@provelog.ai" }]
requires-python = ">=3.11"
keywords = [
    "ai-agents", "local-first", "evidence", "provenance",
    "tamper-evident", "hash-chain", "ed25519", "rfc3161", "offline-verification",
    "llm", "claude-code",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Security",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
]
dependencies = [


    "cryptography>=43.0.1,<47",
    "httpx>=0.27",


    "rfc3161-client>=1.0",


    "zstandard>=0.23",


    "v8serialize>=0.4",


    "fastapi>=0.115.6",
    "uvicorn[standard]>=0.29",
]

[project.urls]
Homepage = "https://provelog.ai"
Source = "https://github.com/provelog/provelog"
Documentation = "https://provelog.ai/install"
Issues = "https://github.com/provelog/provelog/issues"

[project.optional-dependencies]


dev = ["pytest>=8"]

[project.scripts]
provelog = "provelog.cli:main"

[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
provelog = ["trust/*.pem", "assets/*.png", "assets/*.ico",
            "assets/*.svg", "web/*.html"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
filterwarnings = [


    "ignore:Using `httpx` with `starlette.testclient` is deprecated",
]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E741", "B008"]

[tool.ruff.lint.per-file-ignores]

"src/provelog/server/app.py" = ["E501"]

"src/provelog/server/verify_page.py" = ["E501", "I001"]

"src/provelog/chatview/page.py" = ["E501", "I001"]

"src/provelog/pack.py" = ["E501"]

"src/provelog/cli.py" = ["E501"]
"src/provelog/export_flow.py" = ["E501"]
"src/provelog/chatview/app.py" = ["E501"]

"src/provelog/easy.py" = ["E501"]
"src/provelog/import_antigravity.py" = ["E501"]
"src/provelog/import_dsh.py" = ["E501"]
"src/provelog/import_gemini.py" = ["E501"]
"tests/*.py" = ["E501", "UP031"]
